version = "jedi-site-scraper-v2"
lookback_days = 14
review_lookback_days = 30
target_job_count = 60
bright_data_limit = 150
request_timeout_seconds = 15
concurrent_sources = 3
max_retries = 2
max_candidates_per_company = 8
minimum_description_characters = 300
lease_seconds = 90
retention_days = 30

title_aliases = [
  "full stack engineer", "full-stack engineer", "full stack developer",
  "software engineer", "software developer", "web developer",
  "backend engineer", "backend developer", "python developer",
  "machine learning engineer", "ml engineer", "ai engineer",
  "applied ai engineer", "generative ai engineer", "llm engineer",
]
excluded_title_terms = [
  "senior", "sr.", "staff", "principal", "lead", "manager",
  "director", "architect", "head of", "vice president",
]
india_terms = [
  "india", "remote - india", "remote india", "bengaluru", "bangalore",
  "hyderabad", "pune", "gurugram", "gurgaon", "noida", "delhi",
  "mumbai", "chennai", "kolkata", "ahmedabad",
]
remote_terms = ["remote", "worldwide", "anywhere", "global"]
ats_types = [
  "greenhouse", "lever", "ashby", "workable", "smartrecruiters",
  "recruitee", "personio", "workday", "jsonld",
]

