[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jedi-backend"
version = "0.1.0"
description = "FastAPI backend for the private JEDI job-ranking workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.12,<7",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "psycopg[binary]>=3.2.9,<4",
  "PyJWT>=2.10.1,<3",
  "pwdlib[argon2]>=0.3.0,<1",
  "aiosmtplib>=4.0,<5",
  "joblib==1.5.3",
  "numpy==2.5.0",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "xgboost==3.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "aiosqlite>=0.21,<1",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = [
  "backend",
  "backend.routers",
  "backend.schemas",
  "backend.services",
  "backend.tests",
]
package-dir = { backend = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
backend = ["content/*.json"]
